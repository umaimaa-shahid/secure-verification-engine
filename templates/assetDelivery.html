<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Asset Is Ready</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family: Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 24px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="padding: 32px;">
              <h2 style="margin:0 0 16px; color:#111827;">Hello {{name}},</h2>
              <p style="margin:0 0 16px; color:#374151; font-size:15px; line-height:1.5;">
                Your requested <strong>{{assetName}}</strong> is ready.
              </p>
              <p style="margin:0 0 24px;">
                <a href="{{assetUrl}}" style="background:#2563eb; color:#ffffff; text-decoration:none; padding:12px 20px; border-radius:6px; display:inline-block; font-size:14px;">
                  Access Your Asset
                </a>
              </p>
              <p style="margin:0; color:#9ca3af; font-size:13px;">
                Regards,<br />Email Engine
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
